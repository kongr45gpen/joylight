[package]
name = "joylight-backend"
version = "0.1.0"
edition = "2021"
default-run = "joylight-backend"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.97"
ariadne = "0.5.1"
chumsky = "0.9.3"
dyn-clone = "1.0.18"
flexi_logger = { version = "0.29.8", features = ["async","colors"] }
gtk4 = "0.9.5"
log = "0.4.26"
ndarray = "0.16.1"
ndarray-linalg = { version = "0.17.0",  features = ["openblas-system"] }
rand = "0.9.0"
reedline = "0.38.0"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
smallvec = "1.14.0"
zmq = "0.10.0"

[package.metadata.docs.rs]
rustdoc-args = [
    "--html-in-header",
    "katex.html",
]

